<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red de Mentores Académicos</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{

background:#eef3f8;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.contenedor{

background:white;
width:430px;
padding:35px;
border-radius:10px;
box-shadow:0 5px 18px rgba(0,0,0,.2);

}

h1{

text-align:center;
color:#005A9C;
margin-bottom:10px;

}

h3{

text-align:center;
font-weight:normal;
margin-bottom:25px;
color:#555;

}

label{

font-weight:bold;
display:block;
margin-top:15px;

}

input{

width:100%;
padding:12px;
margin-top:5px;
border:1px solid #bbb;
border-radius:5px;

}

button{

margin-top:25px;
width:100%;
padding:14px;
background:#005A9C;
color:white;
font-size:16px;
border:none;
border-radius:5px;
cursor:pointer;

}

button:hover{

background:#004a80;

}

footer{

margin-top:20px;
font-size:12px;
text-align:center;
color:#777;

}

</style>

</head>

<body>

<div class="contenedor">

<h1>Red de Mentores Académicos</h1>

<h3>Portal Institucional</h3>

<label>Usuario institucional</label>
<input type="text" placeholder="Ejemplo: 2024123456">

<label>Contraseña</label>
<input type="password" placeholder="********">

<button onclick="location.href='registro.html'">
Acceder
</button>

<footer>

Universidad Autónoma del Estado de México<br>
Sistema Institucional de Registro

</footer>

</div>

</body>
</html>
